
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iPhone app and package IPA
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"

          if [ -z "$WORKSPACE" ] || [ -z "$PROJECT" ]; then
            echo "Xcode workspace or project not found."
            exit 1
          fi

          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          SCHEMES_JSON="$(xcodebuild -list -json -workspace "$WORKSPACE")"

          echo "Available Xcode schemes:"
          echo "$SCHEMES_JSON"

          SCHEME="$(python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          schemes = d["workspace"]["schemes"]
          preferred = sys.argv[1]
          if preferred in schemes:
              print(preferred)
          else:
              candidates = [s for s in schemes if not s.startswith("Pods-")]
              if not candidates:
                  raise SystemExit("No app scheme found")
              print(candidates[0])
          ' "$PROJECT_NAME" <<< "$SCHEMES_JSON")"

          echo "Using workspace: $WORKSPACE"
          echo "Using project: $PROJECT"
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "Searching for the built iPhone app..."

          APP_PATH="$(find "$GITHUB_WORKSPACE/ios-build/Build/Products" \
            -type d -name '*.app' -path '*iphoneos*' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No iPhone .app found. Build products:"
            find "$GITHUB_WORKSPACE/ios-build/Build/Products" -maxdepth 4 -print
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -r "$GITHUB_WORKSPACE/Ultra-White-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-White-unsigned-IPA
          path: Ultra-White-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
